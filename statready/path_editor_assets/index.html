<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
:root{font-family:Arial,sans-serif;color:#182230}body{margin:0;background:#fff}.toolbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:8px;border:1px solid #d8dee8;border-bottom:0;border-radius:8px 8px 0 0;background:#f7f9fc}.toolbar button,.toolbar select{border:1px solid #aeb8c6;border-radius:6px;background:#fff;padding:6px 9px;cursor:pointer}.toolbar span{font-size:12px;color:#556273}.canvas{border:1px solid #d8dee8;border-radius:0 0 8px 8px;background:#fff;overflow:hidden}svg{display:block;width:100%;height:610px}.edge{stroke:#738296;stroke-width:2;fill:none;marker-end:url(#arrow)}.node{cursor:grab}.node ellipse{fill:#dcecff;stroke:#27364a;stroke-width:2}.node.selected ellipse{stroke:#0068c9;stroke-width:4}.node text{pointer-events:none;font-size:13px;font-weight:600}.hint{font-size:12px;color:#556273;margin-left:auto}
</style>
</head>
<body>
<div class="toolbar">
  <b>Interactive path editor</b>
  <select id="layout"><option>Left to right</option><option>Top to bottom</option><option>Bottom to top</option><option>Radial</option><option>Hierarchical</option></select>
  <button id="apply">Apply layout</button>
  <button data-nudge="left">◀</button><button data-nudge="right">▶</button><button data-nudge="up">▲</button><button data-nudge="down">▼</button>
  <button id="reset">Reset</button><button id="save">Save arrangement</button>
  <span class="hint">Drag a construct, or click it and use the arrows. Save to update exports.</span>
</div>
<div class="canvas"><svg id="svg" viewBox="0 0 1100 610"><defs><marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#738296"></polygon></marker></defs></svg></div>
<script>
const Streamlit={
 ready(){window.parent.postMessage({isStreamlitMessage:true,type:"streamlit:componentReady",apiVersion:1},"*")},
 height(h){window.parent.postMessage({isStreamlitMessage:true,type:"streamlit:setFrameHeight",height:h},"*")},
 value(v){window.parent.postMessage({isStreamlitMessage:true,type:"streamlit:setComponentValue",value:v},"*")}
};
let args={nodes:[],edges:[],positions:{},height:680}, positions={}, initial={}, selected=null, dragging=null;
const svg=document.getElementById('svg');
function cleanPositions(raw){const out={};Object.entries(raw||{}).forEach(([k,v])=>{if(v&&Number.isFinite(Number(v.x))&&Number.isFinite(Number(v.y)))out[k]={x:Number(v.x),y:Number(v.y)}});return out}
function auto(layout){const nodes=args.nodes||[], n=Math.max(nodes.length,1), cols=Math.ceil(Math.sqrt(n));const out={};nodes.forEach((node,i)=>{let x=0,y=0;if(layout==='Radial'){const a=2*Math.PI*i/n;x=550+350*Math.cos(a);y=305+225*Math.sin(a)}else if(layout==='Top to bottom'||layout==='Bottom to top'){const rows=Math.ceil(n/cols);x=130+(i%cols)*(840/Math.max(cols-1,1));y=90+Math.floor(i/cols)*(420/Math.max(rows-1,1));if(layout==='Bottom to top')y=610-y}else{const rows=cols;const columns=Math.ceil(n/rows);x=130+Math.floor(i/rows)*(840/Math.max(columns-1,1));y=90+(i%rows)*(420/Math.max(rows-1,1))}out[node]={x,y}});positions=out;draw()}
function point(ev){const r=svg.getBoundingClientRect();return{x:(ev.clientX-r.left)*1100/r.width,y:(ev.clientY-r.top)*610/r.height}}
function E(name,attrs={}){const e=document.createElementNS('http://www.w3.org/2000/svg',name);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));return e}
function edgePoints(a,b){const dx=b.x-a.x,dy=b.y-a.y,len=Math.max(Math.hypot(dx,dy),1),rx=80,ry=36;return[{x:a.x+dx/len*rx,y:a.y+dy/len*ry},{x:b.x-dx/len*rx,y:b.y-dy/len*ry}]}
function draw(){while(svg.lastChild&&svg.lastChild.tagName!=='defs')svg.removeChild(svg.lastChild);(args.edges||[]).forEach(edge=>{const a=positions[edge.source],b=positions[edge.target];if(!a||!b)return;const [s,t]=edgePoints(a,b);svg.appendChild(E('line',{x1:s.x,y1:s.y,x2:t.x,y2:t.y,class:'edge'}))});(args.nodes||[]).forEach(node=>{const p=positions[node];if(!p)return;const g=E('g',{class:'node'+(selected===node?' selected':''),transform:`translate(${p.x},${p.y})`});g.dataset.id=node;const ellipse=E('ellipse',{rx:80,ry:36});const text=E('text',{'text-anchor':'middle',dy:4});text.textContent=node.length>20?node.slice(0,19)+'…':node;g.append(ellipse,text);g.addEventListener('pointerdown',ev=>{selected=node;dragging=node;ev.preventDefault();draw()});g.addEventListener('click',()=>{selected=node;draw()});svg.appendChild(g)})}
window.addEventListener('pointermove',ev=>{if(!dragging)return;positions[dragging]=point(ev);draw()});
window.addEventListener('pointerup',()=>{dragging=null});
function render(newArgs){args=newArgs;const supplied=cleanPositions(args.positions);if(Object.keys(supplied).length){positions=supplied}else{auto('Left to right')}initial=JSON.parse(JSON.stringify(positions));draw();Streamlit.height(Number(args.height||680))}
window.addEventListener('message',event=>{if(event.data&&event.data.type==='streamlit:render')render(event.data.args||{})});
document.getElementById('apply').onclick=()=>auto(document.getElementById('layout').value);
document.getElementById('reset').onclick=()=>{positions=JSON.parse(JSON.stringify(initial));draw()};
document.getElementById('save').onclick=()=>Streamlit.value(positions);
document.querySelectorAll('[data-nudge]').forEach(button=>button.onclick=()=>{if(!selected)return;const d=button.dataset.nudge,p=positions[selected];if(d==='left')p.x-=20;if(d==='right')p.x+=20;if(d==='up')p.y-=20;if(d==='down')p.y+=20;draw()});
Streamlit.ready();Streamlit.height(680);
</script>
</body>
</html>
